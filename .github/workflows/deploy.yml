# Builds the site and publishes it to GitHub Pages on every push to main.
# The two Supabase values are PUBLIC (they end up in the website anyway) and
# are stored as repository variables, not secrets.
name: Publish website

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/heartbeat.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      - name: Make sure no secret key ended up in the site
        run: |
          if grep -rqE 'sb_secret_[A-Za-z0-9]|BEGIN [A-Z ]*PRIVATE KEY' dist; then
            echo "A secret key was found in the built site. Not publishing."
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
